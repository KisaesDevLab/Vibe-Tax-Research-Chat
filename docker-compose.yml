# Local dev stack. Production stack: docker-compose.prod.yml (Phase 28).
services:
  postgres:
    # pgvector/pgvector:pg16 is postgres:16 with the `vector` extension
    # baked in. Required for the Phase 32 firm reference library (HNSW
    # retrieval over voyage-3-large 1024-dim embeddings). Data dir layout
    # is the standard PostgreSQL 16 PGDATA — fully compatible with any
    # existing volume from postgres:16-alpine.
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: vibe
      POSTGRES_PASSWORD: vibe
      POSTGRES_DB: vibe_tax
    ports:
      - '5439:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U vibe -d vibe_tax']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6389:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: dev
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://vibe:vibe@postgres:5432/vibe_tax
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - '4000:4000'
    volumes:
      - ./apps/api:/app/apps/api
      - ./packages:/app/packages
      - /app/node_modules

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: dev
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: http://localhost:4000
    ports:
      - '5179:5173'
    volumes:
      - ./apps/web:/app/apps/web
      - /app/node_modules

  # Phase 34 — appliance-side authority cache. Talks to upstream sources
  # (uscode.house.gov, ecfr.gov) on a miss; serves from postgres on a
  # hit. The api process calls it at http://authority-mcp:4100 over the
  # docker network. Not exposed to the host in dev; map a port if you
  # want to curl /tools/list directly.
  authority-mcp:
    build:
      context: .
      dockerfile: apps/authority-mcp/Dockerfile
      target: dev
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://vibe:vibe@postgres:5432/vibe_tax
      PORT: '4100'
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '4100:4100'
    volumes:
      - ./apps/authority-mcp:/app/apps/authority-mcp
      - ./packages:/app/packages
      - /app/node_modules

volumes:
  postgres_data:
  redis_data:
