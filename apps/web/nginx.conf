# Phase 28 — nginx serving the SPA + reverse-proxying /api to api:4000.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Static assets with long cache
  location ~* \.(js|css|woff2?|svg|png|jpg|gif|ico)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # SSE compatibility
  location /api/ {
    proxy_pass http://api:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection '';
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 600s;
    # Uploads: backup archives restored during first-run setup (and from
    # Admin → Backup & restore) run to gigabytes. nginx's default 1MB cap
    # rejected them with 413 before the api ever saw the request; the api's
    # own multer limits are authoritative, so disable the cap here and
    # stream the body through instead of spooling it to container disk.
    client_max_body_size 0;
    proxy_request_buffering off;
  }

  # SPA fallback
  location / {
    try_files $uri $uri/ /index.html;
  }
}
