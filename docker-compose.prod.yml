# Production stack for the appliance. Phase 28.
# Single host. Postgres + Redis + api + web (nginx). No exposed ports beyond 80.
services:
  postgres:
    # pgvector/pgvector:pg16 is postgres:16 with the `vector` extension
    # baked in. Required for the Phase 32 firm reference library (HNSW
    # retrieval over 1024-dim embeddings). PGDATA layout is the standard
    # PostgreSQL 16 — fully compatible with an existing volume from a
    # prior postgres:16-alpine deployment, so upgrades are a stop+pull+up.
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: vibe
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: vibe_tax
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U vibe -d vibe_tax']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: runtime
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://vibe:${POSTGRES_PASSWORD}@postgres:5432/vibe_tax
      REDIS_URL: redis://redis:6379
      NODE_ENV: production
      # DR v2 — archives are retained on the api's backups volume and
      # streamed to the admin from there; tmp shares the volume so
      # multi-GB uploads/dumps never land on container tmpfs.
      BACKUP_DIR: /app/backups
      BACKUP_TMP_DIR: /app/backups/tmp
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - attachments:/app/attachments
      - deliverables:/app/storage/deliverables
      - backups:/app/backups
      - ./workspaces:/app/workspaces
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '-', 'http://localhost:4000/api/health']
      interval: 30s
      timeout: 10s
      retries: 3

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: runtime
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - '80:80'
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '-', 'http://localhost/']
      interval: 30s
      timeout: 5s
      retries: 3

  # Phase 34 — appliance-side authority cache. Same DB as the api; not
  # exposed on the host (api reaches it via docker DNS at authority-mcp:4100).
  authority-mcp:
    build:
      context: .
      dockerfile: apps/authority-mcp/Dockerfile
      target: runtime
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://vibe:${POSTGRES_PASSWORD}@postgres:5432/vibe_tax
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '-', 'http://localhost:4100/health']
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
  redis_data:
  attachments:
  deliverables:
  backups:
